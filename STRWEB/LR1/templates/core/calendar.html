{% extends 'base.html' %}
{% load date_filters %}
{% block title %}Календарь{% endblock %}
{% block content %}
<h1>Текстовый календарь — {{ month_name }}</h1>
<p class="text-muted">Сервер (UTC): {{ now|date:"d/m/Y H:i:s" }}</p>
<pre class="bg-light p-3 border rounded">{{ calendar_text }}</pre>
{% endblock %}
