{% extends 'base.html' %}
{% block title %}Контакты{% endblock %}
{% block content %}
<h1>Контакты</h1>
<div class="row">
{% for emp in employees %}
<div class="col-md-4 mb-3">
<div class="card h-100 text-center p-3">
{% if emp.photo %}<img src="{{ emp.photo.url }}" class="rounded-circle mx-auto mb-2" width="100" height="100" style="object-fit:cover">{% endif %}
<h5>{{ emp.name }}</h5>
<p class="text-muted">{{ emp.position }}</p>
<p>{{ emp.phone }}<br>{{ emp.email }}</p>
</div></div>
{% empty %}<p>Сотрудники не добавлены.</p>{% endfor %}
</div>
{% endblock %}
