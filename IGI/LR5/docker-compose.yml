services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lab5
      POSTGRES_USER: lab5
      POSTGRES_PASSWORD: lab5
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  web:
    build: .
    command: >
      sh -c "python manage.py migrate &&
             python manage.py seed_data &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      DEBUG: "True"
      SECRET_KEY: docker-dev-secret-key
      DATABASE_URL: postgres://lab5:lab5@db:5432/lab5
      ALLOWED_HOSTS: localhost,127.0.0.1
    depends_on:
      - db

volumes:
  postgres_data:
